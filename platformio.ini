; PlatformIO Project Configuration File
;
; Two targets, same firmware. Pick one with `pio run -e xiao_c3` or
; `pio run -e xiao_c6` (or the env switcher in the status bar).
; https://docs.platformio.org/page/projectconf.html

[env]
; ESP32-C6 needs Arduino core 3.x, which the registry espressif32 platform
; doesn't ship. Use the pioarduino fork for both boards so they build against
; the same core.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.0
; D6 (the LED data pin) is UART0 TX on both boards, so Serial has to be the
; native USB CDC. Set it explicitly rather than relying on the board file.
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_c3]
board = seeed_xiao_esp32c3

[env:xiao_c6]
board = seeed_xiao_esp32c6
